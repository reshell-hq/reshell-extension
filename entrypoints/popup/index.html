<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reshell</title>
    <style>
      :root {
        --bg: #fafafa;
        --fg: #1a1a2e;
        --border: #e0e0e0;
        --muted: #666;
        --primary: #6366f1;
        --primary-fg: #fff;
        --danger: #ef4444;
        --danger-fg: #fff;
        --hover: #f0f0f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1a2e;
          --fg: #e0e0e0;
          --border: #333;
          --muted: #888;
          --hover: #2a2a3e;
        }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 360px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      header h1 { font-size: 16px; font-weight: 600; }
      header button {
        padding: 4px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        cursor: pointer;
        font-size: 12px;
      }
      header button:hover { background: var(--hover); }
      nav {
        display: flex;
        border-bottom: 1px solid var(--border);
      }
      nav button {
        flex: 1;
        padding: 8px;
        border: none;
        background: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
        border-bottom: 2px solid transparent;
      }
      nav button.active {
        color: var(--primary);
        border-bottom-color: var(--primary);
      }
      section { padding: 12px 16px; display: none; }
      section.active { display: block; }
      .tabs-list { max-height: 300px; overflow-y: auto; }
      .tab-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
      }
      .tab-row:last-child { border-bottom: none; }
      .tab-row input[type="checkbox"] { flex-shrink: 0; }
      .tab-row img { width: 16px; height: 16px; flex-shrink: 0; }
      .tab-row .title {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--fg);
      }
      .actions {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid var(--border);
      }
      .actions button {
        flex: 1;
        padding: 8px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
      }
      .btn-primary { background: var(--primary); color: var(--primary-fg); }
      .btn-primary:disabled { opacity: 0.5; cursor: default; }
      .btn-danger { background: var(--danger); color: var(--danger-fg); }
      .session-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
      }
      .session-row:last-child { border-bottom: none; }
      .session-info { flex: 1; }
      .session-name { font-weight: 500; }
      .session-meta { font-size: 11px; color: var(--muted); }
      .session-actions { display: flex; gap: 4px; }
      .session-actions button {
        padding: 3px 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--fg);
        cursor: pointer;
        font-size: 11px;
      }
      .session-actions button:hover { background: var(--hover); }
      .settings-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 12px;
      }
      .settings-row label { font-size: 12px; color: var(--muted); }
      .settings-row input {
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        font-size: 13px;
      }
      .empty { text-align: center; padding: 24px; color: var(--muted); }
      .config-source-tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 8px;
      }
      .config-source-tabs button {
        flex: 1;
        padding: 4px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--muted);
        cursor: pointer;
        font-size: 11px;
      }
      .config-source-tabs button.active {
        background: var(--primary);
        color: var(--primary-fg);
        border-color: var(--primary);
      }
      .config-area {
        margin-bottom: 8px;
      }
      .config-area textarea {
        width: 100%;
        height: 120px;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        font-family: monospace;
        font-size: 11px;
        resize: vertical;
      }
      .config-area input[type="url"],
      .config-area input[type="file"] {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        font-size: 12px;
      }
      .config-area .fetch-row {
        display: flex;
        gap: 6px;
      }
      .config-area .fetch-row input { flex: 1; }
      .config-area .fetch-row button {
        padding: 4px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        cursor: pointer;
        font-size: 12px;
        white-space: nowrap;
      }
      .config-status {
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 4px;
        margin-bottom: 4px;
      }
      .config-status.ok { background: #d4edda; color: #155724; }
      .config-status.error { background: #f8d7da; color: #721c24; }
      .config-status.loading { background: #fff3cd; color: #856404; }
      @media (prefers-color-scheme: dark) {
        .config-status.ok { background: #1a3a22; color: #86e0a0; }
        .config-status.error { background: #3a1a1a; color: #e08686; }
        .config-status.loading { background: #3a3a1a; color: #e0e086; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Reshell</h1>
      <button id="btn-settings">⚙</button>
    </header>
    <nav>
      <button data-tab="tabs" class="active">Open Tabs</button>
      <button data-tab="sessions">Sessions</button>
      <button data-tab="settings">Settings</button>
    </nav>
    <section id="tabs" class="active">
      <div class="tabs-list" id="tabs-list"></div>
      <div class="actions">
        <button class="btn-primary" id="btn-collapse" disabled>Collapse Selected</button>
        <button class="btn-primary" id="btn-collapse-all">Collapse All</button>
      </div>
    </section>
    <section id="sessions">
      <div class="tabs-list" id="sessions-list"></div>
    </section>
    <section id="settings">
      <div class="settings-row">
        <label for="reshell-url">Reshell URL</label>
        <input type="text" id="reshell-url" placeholder="http://localhost:3000" />
      </div>
      <div class="settings-row">
        <label>Config Override</label>
        <div class="config-source-tabs">
          <button data-config-tab="none" class="active">None</button>
          <button data-config-tab="paste">Paste</button>
          <button data-config-tab="upload">Upload</button>
          <button data-config-tab="fetch">Fetch URL</button>
        </div>
        <div class="config-area" id="config-paste" style="display:none">
          <textarea id="config-textarea" placeholder='Paste your reshell.config.json here...'></textarea>
        </div>
        <div class="config-area" id="config-upload" style="display:none">
          <input type="file" id="config-file" accept=".json" />
        </div>
        <div class="config-area" id="config-fetch" style="display:none">
          <div class="fetch-row">
            <input type="url" id="config-url" placeholder="https://raw.githubusercontent.com/..." />
            <button id="btn-fetch-config">Fetch</button>
          </div>
        </div>
        <div id="config-status" class="config-status" style="display:none"></div>
      </div>
      <div class="actions">
        <button class="btn-primary" id="btn-save-url">Save</button>
      </div>
    </section>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
